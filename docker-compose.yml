version: '3.8'

services:
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    environment:
      FLASK_ENV: development
      FLASK_APP: app/api.py
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: flask_api_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"